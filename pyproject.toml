[project]
name = "mymarket"
version = "0.1.0"
description = "Malaysian news and product-price awareness MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "feedparser>=6,<7",
    "scrapling[fetchers]>=0.3,<1",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rapidfuzz>=3,<4",
    "python-dotenv>=1,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6",
    "torch>=2.5,<3",
    "joblib>=1.4,<2",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
training = ["lightgbm>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mymarket = "mymarket.mcp_server:main"

# Inference runs on CPU; avoid CUDA runtime downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
