[project]
name = "newsprice-dataprep"
version = "0.1.0"
description = "Data preparation for staple-food price and news datasets"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
